services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: cabbo-backend-prod
    ports:
      - "8000:8000"
    env_file:
      - .env.prod
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

 
 
