services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: cabbo-backend-local
    ports:
      - "8000:8000"
    env_file:
      - .env.local
    volumes:
      - ./logs:/app/logs
    restart: "no"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

 
 
