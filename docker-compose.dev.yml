services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: cabbo-backend-dev
    ports:
      - "8000:8000"
    env_file:
      - .env.dev
    environment:
      DB_SSL_CA: /run/secrets/db-ca.pem
    volumes:
      - ./certs/db/dev-db-ca.pem:/run/secrets/db-ca.pem:ro
    restart: "no"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

 
 
